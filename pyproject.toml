[project]
name = "vws-portfwd"
version = "0.1.0"
description = "Cross-platform CLI for AWS SSO + SSM Port Forwarding (VWS internal)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VWS" }]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.scripts]
vws-portfwd = "vws_portfwd.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
